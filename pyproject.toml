[project]
name = "bio-research-skills"
version = "0.1.0"
description = "Agent Skills for life-science research: track the literature, read what matters, reproduce the code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Jinsong Zhou" }]

# Skills ship as standalone stdlib scripts so `npx skills add` needs no install
# step. Everything below is for developing and testing this repo only.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Only tests/ uses this, to read SKILL.md frontmatter the way Claude Code
    # does. The skills themselves stay standard-library — see `dependencies`.
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
# `skills` is each skill's own suite; `tests` is the repository's, which checks
# the parts of a skill that live outside its scripts.
testpaths = ["skills", "tests"]
markers = [
    "live: hits a real API; deselect with -m 'not live'",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
# Each skill's scripts/ directory is its own import root: the scripts run
# directly (`python3 scripts/track.py`), which puts scripts/ on sys.path.
extraPaths = [
    "skills/literature-tracking/scripts",
    "skills/paper-deep-reading/scripts",
    "skills/code-reproduction/scripts",
]
pythonVersion = "3.9"
